# Builds the app and publishes it to GitHub Pages (https://gophertli.github.io/niimblue-e1/),
# so Android Chrome can install it with a Share menu entry. Runs on every push to android-share.
name: Deploy to GitHub Pages

on:
  push:
    branches: [android-share]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DEPLOY_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          COMMIT_HASH: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
